# Rate-limit zone for the API surface (POST /api/beta, /api/developer, and any future /api/*
# route) — 5 requests/min per IP with a small burst, sized for signup-form traffic, not real
# users hammering the API. Declared here (outside any server{} block) rather than in nginx.conf's
# own http{} block because this file is included *inside* that block by the official nginx image
# (see docker-compose.yml's mount to /etc/nginx/conf.d/default.conf) — http-context directives are
# valid anywhere in an included conf.d file. See docs/SECURITY.md for the full rationale.
limit_req_zone $binary_remote_addr zone=api_signup:10m rate=5r/m;
# POST /api/validate (optional KoSIT + Mustang check) starts Java validators, so it gets its own,
# tighter budget. CORS preflights (OPTIONS) map to an empty key, which limit_req doesn't count, so
# one check costs one request, not two. The backend adds its own per-IP limit on top.
map $request_method $validate_limit_key {
    OPTIONS "";
    default $binary_remote_addr;
}
limit_req_zone $validate_limit_key zone=api_validate:10m rate=6r/m;
# POST /api/validate/upload (validate an existing XML/PDF): up to three JVMs per request, so tighter.
limit_req_zone $validate_limit_key zone=api_upload:10m rate=3r/m;
# GET /api/docs (read-only API documentation page). One page view is about a dozen small GETs
# (HTML, scripts, stylesheets, the spec), which the 5r/m signup zone on /api/ would answer with 429.
# Static content from the backend's memory and disk, no validator, no database.
limit_req_zone $binary_remote_addr zone=api_docs:1m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Real client IP behind Cloudflare. CF-Connecting-IP is trusted ONLY when the TCP peer is in one of Cloudflare's
# published ranges; from any other peer it is ignored and $remote_addr stays the real peer (a direct connection to
# the origin cannot spoof it). The header holds exactly one address, so real_ip_recursive stays off. With this,
# every limit_req/limit_conn zone and the private-gate allow list see the real client instead of a Cloudflare edge.
# Source: https://www.cloudflare.com/ips-v4 and /ips-v6, fetched 2026-11-25 (22 ranges, same as internal staging).
# Re-check the list before every change of this file.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

server {
    listen 80;
    server_name api.openinvoicexml.com api.openinvoicexml.de;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 308, not 301: a POST must stay a POST through the redirect. api.openinvoicexml.de lands here
    # too and goes straight to the new API host (one hop).
    location / {
        return 308 https://api.openinvoicexml.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.openinvoicexml.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/api.openinvoicexml.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.openinvoicexml.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Not preloaded on purpose — see docs/SECURITY.md ("Headers" section) for why.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    limit_conn addr 20;

    location ~ /\. {
        deny all;
    }

    # Exact match, so it wins over /api/ below. Invoice XML is bigger than signup JSON; the whole
    # body is kept in memory (client_body_buffer_size = client_max_body_size) so nginx never writes
    # invoice data to a temp file. A validation can take ~15 s plus queueing, hence the longer
    # read timeout (a bit above the backend's VALIDATION_TIMEOUT_MS + relay margin).
    location = /api/validate {
        include /etc/nginx/private-gate.conf;

        limit_req zone=api_validate burst=3 nodelay;
        limit_req_status 429;

        client_max_body_size 1m;
        client_body_buffer_size 1m;
        proxy_read_timeout 90s;

        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: the backend gets exactly one address, the one nginx verified above.
        # Client-sent forwarding headers are dropped so nothing behind nginx can be misled by them.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded invoices (XML or PDF). Same in-memory rule as above, with the PDF limit (the backend
    # applies the smaller XML limit itself). A PDF runs veraPDF + KoSIT + Mustang in a row.
    location = /api/validate/upload {
        include /etc/nginx/private-gate.conf;

        limit_req zone=api_upload burst=2 nodelay;
        limit_req_status 429;

        client_max_body_size 10m;
        client_body_buffer_size 10m;
        proxy_read_timeout 150s;

        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: the backend gets exactly one address, the one nginx verified above.
        # Client-sent forwarding headers are dropped so nothing behind nginx can be misled by them.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API documentation (Swagger UI, served by the backend: backend/src/100-middleware/docs.ts).
    # Longest prefix wins, so these two take /api/docs from the generic /api/ block below; the three
    # locations around them are unchanged. Read-only: nothing but GET/HEAD is passed on.
    #
    # No add_header here on purpose: an add_header in a location drops every header inherited from
    # the server block (HSTS, nosniff, ...). The page's Content-Security-Policy comes from the
    # backend, for these routes only.
    #
    # Public on purpose (no private-gate.conf include): documentation only. The validate routes
    # above keep their gate and their own limits.
    location = /api/docs {
        return 308 /api/docs/;
    }

    location /api/docs/ {
        limit_req zone=api_docs burst=40 nodelay;
        limit_req_status 429;

        limit_except GET {
            deny all;
        }

        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: the backend gets exactly one address, the one nginx verified above.
        # Client-sent forwarding headers are dropped so nothing behind nginx can be misled by them.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_signup burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: the backend gets exactly one address, the one nginx verified above.
        # Client-sent forwarding headers are dropped so nothing behind nginx can be misled by them.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: the backend gets exactly one address, the one nginx verified above.
        # Client-sent forwarding headers are dropped so nothing behind nginx can be misled by them.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

