# Rate-limit zone for the API surface (POST /api/beta, /api/developer, and any future /api/*
# route) — 5 requests/min per IP with a small burst, sized for signup-form traffic, not real
# users hammering the API. Declared here (outside any server{} block) rather than in nginx.conf's
# own http{} block because this file is included *inside* that block by the official nginx image
# (see docker-compose.yml's mount to /etc/nginx/conf.d/default.conf) — http-context directives are
# valid anywhere in an included conf.d file. See docs/SECURITY.md for the full rationale.
limit_req_zone $binary_remote_addr zone=api_signup:10m rate=5r/m;
# POST /api/validate (optional KoSIT + Mustang check) starts Java validators, so it gets its own,
# tighter budget. CORS preflights (OPTIONS) map to an empty key, which limit_req doesn't count, so
# one check costs one request, not two. The backend adds its own per-IP limit on top.
map $request_method $validate_limit_key {
    OPTIONS "";
    default $binary_remote_addr;
}
limit_req_zone $validate_limit_key zone=api_validate:10m rate=6r/m;
# POST /api/validate/upload (validate an existing XML/PDF): up to three JVMs per request, so tighter.
limit_req_zone $validate_limit_key zone=api_upload:10m rate=3r/m;
limit_conn_zone $binary_remote_addr zone=addr:10m;

server {
    listen 80;
    server_name api.openinvoicexml.de;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.openinvoicexml.de;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/api.openinvoicexml.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.openinvoicexml.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Not preloaded on purpose — see docs/SECURITY.md ("Headers" section) for why.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    limit_conn addr 20;

    location ~ /\. {
        deny all;
    }

    # Exact match, so it wins over /api/ below. Invoice XML is bigger than signup JSON; the whole
    # body is kept in memory (client_body_buffer_size = client_max_body_size) so nginx never writes
    # invoice data to a temp file. A validation can take ~15 s plus queueing, hence the longer
    # read timeout (a bit above the backend's VALIDATION_TIMEOUT_MS + relay margin).
    location = /api/validate {
        include /etc/nginx/private-gate.conf;

        limit_req zone=api_validate burst=3 nodelay;
        limit_req_status 429;

        client_max_body_size 1m;
        client_body_buffer_size 1m;
        proxy_read_timeout 90s;

        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded invoices (XML or PDF). Same in-memory rule as above, with the PDF limit (the backend
    # applies the smaller XML limit itself). A PDF runs veraPDF + KoSIT + Mustang in a row.
    location = /api/validate/upload {
        include /etc/nginx/private-gate.conf;

        limit_req zone=api_upload burst=2 nodelay;
        limit_req_status 429;

        client_max_body_size 10m;
        client_body_buffer_size 10m;
        proxy_read_timeout 150s;

        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_signup burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name openinvoicexml.de www.openinvoicexml.de;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://openinvoicexml.de$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.openinvoicexml.de;
    server_tokens off;

    # Same cert lineage as the apex block below — expanded to include www.openinvoicexml.de
    # as a SAN (see DEPLOY.md) rather than issued as its own lineage, since this block only
    # ever redirects and never serves content of its own.
    ssl_certificate     /etc/letsencrypt/live/openinvoicexml.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openinvoicexml.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://openinvoicexml.de$request_uri;
}

server {
    listen 443 ssl;
    server_name openinvoicexml.de;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/openinvoicexml.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openinvoicexml.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Not preloaded on purpose — see docs/SECURITY.md ("Headers" section) for why.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Unlike api.openinvoicexml.de above, this origin serves HTML — see docs/SECURITY.md for
    # what this policy allows and why. Static Vite build: no inline scripts/styles, one
    # cross-origin fetch target (the API).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.openinvoicexml.de; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    limit_conn addr 20;

    root /usr/share/nginx/html;
    index index.html;

    location ~ /\. {
        deny all;
    }

    # Single-page app: index.html + client-side router (frontend/src/000-core/routes.ts). Old
    # multi-page URLs (privacy.html, ...) redirect to the clean ones.
    location ~ ^/(privacy|impressum|beta|developer|invoicing|validate)\.html$ {
        return 301 $scheme://$http_host/$1;
    }

    # Preview pages: access is decided by private-gate.conf (open when it holds only comments).
    # The JS chunks under /assets/ stay public; only the route is gated.
    location = /invoicing {
        include /etc/nginx/private-gate.conf;
        try_files /index.html =404;
    }

    location = /validate {
        include /etc/nginx/private-gate.conf;
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        # $uri/ is what makes nginx apply the `index` directive above for directory-style
        # requests (e.g. "/") — without it, try_files looks for a literal file named "/",
        # never finds one, and 404s before ever considering index.html.
        try_files $uri $uri/ /index.html;
    }
}
