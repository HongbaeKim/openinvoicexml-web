    }
}

server {
    listen 443 ssl;
    server_name www.openinvoicexml.com;
    server_tokens off;

    # Same cert lineage as the apex block below (www is a SAN on it), since this block only ever
    # redirects and never serves content of its own.
    ssl_certificate     /etc/letsencrypt/live/openinvoicexml.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openinvoicexml.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://openinvoicexml.com$request_uri;
}

server {
    listen 443 ssl;
    server_name openinvoicexml.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/openinvoicexml.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openinvoicexml.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Not preloaded on purpose — see docs/SECURITY.md ("Headers" section) for why.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Unlike api.openinvoicexml.com above, this origin serves HTML — see docs/SECURITY.md for
    # what this policy allows and why. Static Vite build: no inline scripts/styles, one
    # cross-origin fetch target (the API).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.openinvoicexml.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    limit_conn addr 20;

    root /usr/share/nginx/html;
    index index.html;

    location ~ /\. {
        deny all;
    }

    # Single-page app: index.html + client-side router (frontend/src/000-core/routes.ts). Old
    # multi-page URLs (privacy.html, ...) redirect to the clean ones.
    location ~ ^/(privacy|impressum|beta|developer|invoicing|validate)\.html$ {
        return 301 $scheme://$http_host/$1;
    }

    # Preview pages: access is decided by private-gate.conf (open when it holds only comments).
    # The JS chunks under /assets/ stay public; only the route is gated.
    location = /invoicing {
        # include /etc/nginx/private-gate.conf;
        try_files /index.html =404;
    }

    location = /validate {
        # include /etc/nginx/private-gate.conf;
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        # $uri/ is what makes nginx apply the `index` directive above for directory-style
        # requests (e.g. "/") — without it, try_files looks for a literal file named "/",
        # never finds one, and 404s before ever considering index.html.
        try_files $uri $uri/ /index.html;
    }
}

# --- Legacy .de names (permanent redirects to .com) -----------------------------------------------
# Certificates are the old .de lineages, which must keep renewing for as long as these blocks exist.
# HSTS stays on them (max-age 1 year, includeSubDomains, no preload), so browsers that visited .de
# keep reaching this redirect over HTTPS.

server {
    listen 443 ssl;
    server_name openinvoicexml.de www.openinvoicexml.de;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/openinvoicexml.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openinvoicexml.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://openinvoicexml.com$request_uri;
}

# The API moved to api.openinvoicexml.com. 308 keeps the method and body, so curl -L and most HTTP
# libraries can still POST. A browser CORS preflight (OPTIONS) does not follow redirects, so
# browser-based callers of the old host break by design; the site itself only calls the new host.
server {
    listen 443 ssl;
    server_name api.openinvoicexml.de;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/api.openinvoicexml.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.openinvoicexml.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 308 https://api.openinvoicexml.com$request_uri;
}
